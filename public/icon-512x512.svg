<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0" />
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="0.45" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#0b5bd3" />
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="80" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft inner highlight -->
  <circle cx="170" cy="150" r="180" fill="#ffffff" opacity="0.12"/>

  <!-- Travel path (paper plane route) -->
  <path d="M135 205 C 190 165, 245 140, 320 150 C 375 158, 410 200, 430 245"
        fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <path d="M135 205 C 190 165, 245 140, 320 150 C 375 158, 410 200, 430 245"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.25"/>

  <!-- Small airplane -->
  <g transform="translate(340 135)">
    <path d="M58 22 L 34 34 L 44 50 L 14 44 L 0 60 L 10 0 L 14 30 L 44 30 L 34 46 Z"
          fill="#ffffff" opacity="0.92"/>
    <path d="M58 22 L 34 34 L 44 50 L 14 44 L 0 60 L 10 0 L 14 30 L 44 30 L 34 46 Z"
          fill="url(#accent)" opacity="0.65"/>
  </g>

  <!-- Open book -->
  <g transform="translate(0 12)">
    <rect x="110" y="215" width="292" height="208" rx="28" fill="#0b1b35" opacity="0.15"/>

    <!-- left page -->
    <path d="M116 230 C 160 205, 216 200, 260 215
             L 260 410
             C 214 395, 160 400, 116 423 Z"
          fill="#ffffff" opacity="0.92"/>
    <path d="M132 248 C 168 232, 214 228, 246 238"
          fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

    <!-- right page -->
    <path d="M256 215 C 308 198, 372 206, 396 224
             L 396 423
             C 366 403, 310 402, 256 410 Z"
          fill="#ffffff" opacity="0.92"/>
    <path d="M280 238 C 320 224, 360 232, 382 250"
          fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" opacity="0.0"/>

    <!-- spine / gap -->
    <rect x="250" y="215" width="12" height="210" rx="6" fill="#0b1b35" opacity="0.18"/>

    <!-- page shadow -->
    <path d="M116 230 C 160 205, 216 200, 260 215"
          fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Little spark accents -->
  <g opacity="0.9">
    <circle cx="120" cy="152" r="10" fill="#fbbf24"/>
    <circle cx="150" cy="132" r="6" fill="#fef3c7" opacity="0.9"/>
    <circle cx="408" cy="170" r="9" fill="#fb7185" opacity="0.85"/>
  </g>
</svg>

